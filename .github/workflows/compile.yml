name: compile
on: [pull_request, push]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # build-image.yml と gha キャッシュを共有し、ローカル daemon に load する。
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yuseiito/texlive-ubuntu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # イメージは上で用意済みのため、Makefile のビルド定義のみ再利用する。
      - name: Compile document
        run: touch .image-built && make all

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: src/main.pdf
          if-no-files-found: error
